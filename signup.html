<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign up — ParfAI</title>
<link rel="stylesheet" href="parfai.css?v=202608251758">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<nav id="nav-slot"></nav>

<div class="authwrap">
  <div class="authcard">
    <h1 id="h1">Create your account</h1>
    <p class="sub" id="sub">Free forever — upgrade to Scent Pro anytime.</p>
    <form id="signup-form">
      <div class="field"><label>Name</label><input id="su-name" type="text" placeholder="Your name" required></div>
      <div class="field"><label>Email</label><input id="su-email" type="email" placeholder="you@example.com" required></div>
      <div class="field"><label>Password</label><input id="su-password" type="password" placeholder="At least 8 characters" minlength="8" required></div>
      <button class="btn" type="submit" id="cta">Create account</button>
      <div id="su-msg"></div>
    </form>
    <div class="divider">or</div>
    <div class="oauth">
      <a class="btn ghost block" href="#">Continue with Apple</a>
      <a class="btn ghost block" href="#">Continue with Google</a>
    </div>
    <div class="switchline">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<div id="footer-slot"></div>

<script src="data.js?v=202608251758"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script>
  if (qs('plan') === 'pro'){
    document.getElementById('h1').textContent = 'Start Scent Pro';
    document.getElementById('sub').textContent = '$4.99/mo or $34.99/yr — cancel anytime.';
    document.getElementById('cta').textContent = 'Create account & continue';
  }

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('su-msg');
    const btn = document.getElementById('cta');
    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;

    if (!_sb){
      msg.className = 'rvmsg err';
      msg.textContent = 'Sign-up service unavailable right now — please try again later.';
      return;
    }

    const origText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Creating account…';
    const { data, error } = await _sb.auth.signUp({
      email, password,
      options: { data: { full_name: name } }
    });
    btn.disabled = false; btn.textContent = origText;

    if (error){
      msg.className = 'rvmsg err';
      msg.textContent = error.message || 'Something went wrong — please try again.';
      return;
    }

    if (data && data.session){
      msg.className = 'rvmsg ok';
      msg.textContent = 'Account created — redirecting…';
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } else {
      msg.className = 'rvmsg ok';
      msg.textContent = 'Almost there — check your email to confirm your account, then log in.';
    }
  });
</script>
</body>
</html>
