<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign up — ParfAI</title>
<link rel="stylesheet" href="parfai.css">
</head>
<body>

<nav id="nav-slot"></nav>

<div class="authwrap">
  <div class="authcard">
    <h1 id="h1">Create your account</h1>
    <p class="sub" id="sub">Free forever — upgrade to Scent Pro anytime.</p>
    <form onsubmit="event.preventDefault(); alert('This is a design demo — sign-up isn\'t wired up yet.');">
      <div class="field"><label>Name</label><input type="text" placeholder="Your name" required></div>
      <div class="field"><label>Email</label><input type="email" placeholder="you@example.com" required></div>
      <div class="field"><label>Password</label><input type="password" placeholder="At least 8 characters" required></div>
      <button class="btn" type="submit" id="cta">Create account</button>
    </form>
    <div class="divider">or</div>
    <div class="oauth">
      <a class="btn ghost block" href="#">Continue with Apple</a>
      <a class="btn ghost block" href="#">Continue with Google</a>
    </div>
    <div class="switchline">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<div id="footer-slot"></div>

<script src="data.js"></script>
<script>
  if (qs('plan') === 'pro'){
    document.getElementById('h1').textContent = 'Start Scent Pro';
    document.getElementById('sub').textContent = '$4.99/mo or $34.99/yr — cancel anytime.';
    document.getElementById('cta').textContent = 'Create account & continue';
  }
</script>
</body>
</html>
