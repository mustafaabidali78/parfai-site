<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact — ParfAI</title>
<link rel="stylesheet" href="parfai.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<nav id="nav-slot"></nav>
<div class="wrap">
  <div class="authwrap" style="margin-top:40px">
    <div class="authcard">
      <h1>Get in touch</h1>
      <p class="sub">Questions, partnership ideas, or a fragrance we're missing — let us know.</p>
      <form onsubmit="event.preventDefault(); alert('This is a design demo — the contact form isn\'t wired up yet.');">
        <div class="field"><label>Name</label><input type="text" required></div>
        <div class="field"><label>Email</label><input type="email" required></div>
        <div class="field"><label>Message</label><input type="text" placeholder="How can we help?" required></div>
        <button class="btn" type="submit">Send message</button>
      </form>
    </div>
  </div>
</div>
<div id="footer-slot"></div>
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
</body>
</html>
