<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<meta id="pgdesc" name="description" content="Fragrance notes, ratings, and where to buy on ParfAI."/>
<link id="canonical" rel="canonical" href="https://parfai.org/perfume.html">

<meta id="twitter-title" name="twitter:title" content="Fragrance — ParfAI">
<meta id="twitter-desc" name="twitter:description" content="Fragrance notes, ratings, and where to buy on ParfAI.">

<link rel="stylesheet" href="parfai.css?v=202610112300">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://parfai.org/#organization",
      "name": "ParfAI",
      "url": "https://parfai.org/",
      "logo": "https://parfai.org/images/social/logo-square.jpg",
      "description": "ParfAI is a fragrance discovery platform helping people find their next signature scent through real notes, smart matching tools, and a growing community."
    },
    {
      "@type": "WebSite",
      "@id": "https://parfai.org/#website",
      "name": "ParfAI",
      "url": "https://parfai.org/",
      "publisher": { "@id": "https://parfai.org/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://parfai.org/explore.html?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
</script>
<style>
  .pyramid .plevel{display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:8px}
  .pyramid .plevel .lh{width:100%;margin-bottom:4px}
  .pyramid .notechip{margin:0}
  .accordwrap{margin:22px 0 6px}
  .ratingbars{margin:20px 0 0}
  .dsec{margin-top:56px}
  .dsec .shead{margin-bottom:18px}
  .rvpill{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;background:#faf7f1;border:1px solid var(--border);border-radius:24px;padding:6px 7px 6px 16px;font-size:13.5px;color:var(--ink2)}
  .rvstars{color:#d8d2c5;letter-spacing:2px;font-size:16px}.rvstars.on{color:#E8742A}
  .rvcnt b{color:var(--ink)}
  .rvglow{position:relative;overflow:hidden;display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border:0;border-radius:999px;color:#10341d;cursor:pointer;font:700 14px/1.2 Inter,system-ui,sans-serif;background:linear-gradient(135deg,#bfe6c9,#8fd7a6 55%,#c9ecb4);box-shadow:0 6px 18px rgba(86,170,114,.38),inset 0 1px 0 rgba(255,255,255,.6)}
  .rvglow::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:rvshine 3.6s ease-in-out infinite;pointer-events:none}
  @keyframes rvshine{0%,55%{left:-60%}100%{left:130%}}
  .rvglow:focus-visible{outline:3px solid #1F4A2C;outline-offset:2px}
  @media(prefers-reduced-motion:reduce){.rvglow::after{animation:none}}
  .rvlist{margin-top:18px}
  .rvc{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px;max-width:680px}
  .rvc b{font-size:14px}.rvc .st{color:#E8742A;font-size:13px;margin-left:8px;letter-spacing:1px}
  .rvc p{margin:6px 0 0;font-size:14px;color:var(--ink2);overflow-wrap:anywhere}
</style>
</head>
<body>

<nav id="nav-slot"></nav>

<div class="wrap" id="content">
  <!-- filled by script -->
</div>

<div id="footer-slot"></div>

<script src="data.js?v=202610112300"></script>
<script src="catalog-lib.js?v=202610090030"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="reviews.js"></script>
<script>
(async function(){
  let LINKS = {};
  try { const rr = await fetch('catalog/perfume-links.json'); if (rr.ok) LINKS = await rr.json(); } catch (e) {}
  const id = qs('id');
  const p = perfumeById(id);
  const content = document.getElementById('content');
  // fall back gracefully if a visitor's cached data.js predates this helper
  const safeNoteIcon = typeof noteIcon==='function' ? noteIcon : () => '';

  if (!p){
    content.innerHTML = `<div class="doc"><h1>Fragrance not found</h1><p>We couldn't find that one in the catalog yet.</p><a class="btn" href="explore.html">← Back to Explore</a></div>`;
  } else {
    const pageTitle = `${p.name} by ${houseName(p.houseId)} — ParfAI`;
    const metaDesc = p.description && p.description.length <= 160 ? p.description : `${p.name} by ${houseName(p.houseId)}: notes, ratings, and where to buy on ParfAI.`;
    updateSocialTags({
      title: pageTitle,
      desc: metaDesc,
      url: `https://parfai.org/perfume.html?id=${encodeURIComponent(p.id)}`,
      image: p.image ? (/^https?:\/\//.test(p.image) ? p.image : `https://parfai.org/${p.image}`) : null,
    });
    const g = famColor(p.family);
    const similar = PERFUMES.filter(x=>x.id!==p.id && (x.family===p.family || x.houseId===p.houseId)).slice(0,4);
    const dupes = (p.dupeIds||[]).map(perfumeById).filter(Boolean);
    const original = p.dupeOf ? perfumeById(p.dupeOf) : null;

    // Search words for Amazon.ae and Noon: house plus the perfume name.
    const shopQ = (houseName(p.houseId) + ' ' + p.name).replace(/\s+/g,' ').trim();
    const retailers = [
      {id:'fn', name:'FragranceNet', sub:'US store', url:(LINKS[p.id] && LINKS[p.id].l) || `https://www.fragrancenet.com/catalogsearch/result?q=${encodeURIComponent(p.name)}`},
      {id:'amz', name:'Amazon.ae', sub:'UAE', url:amazonAE(shopQ)},
      {id:'noon', name:'Noon', sub:'UAE', url:noonAE(shopQ), cls:' noonlink'},
    ];

    // Bottle cards in the same white "pedestal" style as Explore.
    const simCard = x => {
      const notes = [...x.notes.top, ...x.notes.heart, ...x.notes.base].map(n => String(n).toLowerCase());
      const R = { slug: x.id, name: x.name, notes: notes.length ? notes : ['musk'], pid: (LINKS[x.id] || {}).p || '' };
      const stage = PFC.stage(R, 170);
      return '<a class="pd" style="--c1:' + PFC.tint(R) + ';text-decoration:none;color:inherit" href="perfume.html?id=' + encodeURIComponent(x.id) + '">' +
        '<div class="pd-tg"><span class="gt">' + PFC.esc(x.gender) + '</span>' + (x.dupeOf ? '<span class="dp">DUPE</span>' : '') + '</div>' + stage +
        '<div class="pd-hh">' + PFC.esc(houseName(x.houseId)) + '</div><div class="pd-nm">' + PFC.esc(x.name) + '</div>' +
        '<div class="pd-nt">' + PFC.esc(notes.slice(0, 3).map(PFC.cap).join(', ')) + '</div></a>';
    };

    content.innerHTML = `
      <div class="crumb"><a href="explore.html">Explore</a> / <a href="house.html?id=${p.houseId}">${houseName(p.houseId)}</a> / ${p.name}</div>

      <div class="pdhero" style="background:linear-gradient(135deg,${g[0]},${g[1]})">
        <div class="pdimg">
          ${sigCanvasHTML(p)}
          ${p.image ? `<img class="realphoto" src="${p.image}" alt="${p.name} bottle" loading="eager" fetchpriority="high" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'bottle'}))">` : `<div class="bottle"></div>`}
        </div>
        <div>
          <div class="pdhouse"><a href="house.html?id=${p.houseId}">${houseName(p.houseId)}</a></div>
          <h1 class="pdname">${p.name}${original ? ' <span style="font-size:18px;color:rgba(255,255,255,.8);font-weight:600;display:block;margin-top:8px">— a ' + original.name + ' dupe</span>' : ''}</h1>
          <div class="pdmeta">
            <span><b>★ ${p.rating}</b></span>
            <span>${p.year} · ${p.concentration}</span>
            <span>${p.gender}</span>
            ${p.perfumer ? `<span>By ${p.perfumer}</span>` : ''}
          </div>
          <div class="pddesc">${p.description}</div>
          <div class="pdbuy" id="retailers"></div>
          <div class="disclose">Prices change often, so check the current price on the store page. Noon code <b>NDY353</b> gives cashback at checkout (terms apply). ParfAI earns a commission when you buy through these links, at no extra cost to you. As an Amazon Associate I earn from qualifying purchases. <a href="affiliate-disclosure.html" style="color:inherit;text-decoration:underline">Affiliate disclosure</a></div>
          ${!p.dupeOf ? `<div style="margin-top:16px"><a class="btn" style="background:#141414" href="dupe-finder.html?for=${p.id}">Find an affordable dupe →</a></div>` : ''}
        </div>
      </div>

      <section>
        <div class="shead"><h2>Notes pyramid</h2><a href="notes.html">Browse by note →</a></div>
        <div class="pyramid">
          <div class="plevel"><div class="lh">TOP NOTES</div>${p.notes.top.map(n=>`<a class="notechip" href="notes.html?n=${encodeURIComponent(n)}">${safeNoteIcon(n)}${n}</a>`).join('')}</div>
          <div class="plevel"><div class="lh">HEART NOTES</div>${p.notes.heart.map(n=>`<a class="notechip" href="notes.html?n=${encodeURIComponent(n)}">${safeNoteIcon(n)}${n}</a>`).join('')}</div>
          <div class="plevel"><div class="lh">BASE NOTES</div>${p.notes.base.map(n=>`<a class="notechip" href="notes.html?n=${encodeURIComponent(n)}">${safeNoteIcon(n)}${n}</a>`).join('')}</div>
        </div>
        <div class="accordwrap">${p.accords.map((a,i)=>`<span class="accord" style="background:linear-gradient(140deg,${famColor(p.family)[0]},${famColor(p.family)[1]})">${a}</span>`).join('')}</div>
        <div class="ratingbars">
          <div class="ratingbar"><b>Longevity</b><div class="rbtrack"><div class="rbfill" style="width:${p.longevity.includes('12h')?'95%':p.longevity.includes('7-12')?'75%':p.longevity.includes('Moderate')?'50%':'30%'}"></div></div><span style="font-size:12px;color:var(--muted)">${p.longevity}</span></div>
          <div class="ratingbar"><b>Sillage</b><div class="rbtrack"><div class="rbfill" style="width:${p.sillage==='Strong'?'85%':p.sillage==='Moderate'?'55%':'30%'}"></div></div><span style="font-size:12px;color:var(--muted)">${p.sillage}</span></div>
        </div>
      </section>

      <section>
        <div class="shead"><h2>Scent DNA</h2></div>
        <div class="dnawrap">
          <div class="dnachart">${scentDnaSVG(p, 300)}</div>
          <div class="dnacaption">
            <p>A fingerprint of ${p.name}'s note profile, plotted from its actual top, heart, and base notes — the further a point reaches, the more that family shows up across the pyramid.</p>
            <p style="font-size:12px;color:var(--muted)">Generated live from this fragrance's data — no two profiles in the catalog look quite the same.</p>
          </div>
        </div>
      </section>

      ${dupes.length ? `
      <section>
        <div class="shead"><h2>Affordable dupes</h2><a href="dupe-finder.html?for=${p.id}">Full comparison →</a></div>
        <div class="grid">${dupes.map(simCard).join('')}</div>
      </section>` : ''}

      <section>
        <div class="shead"><h2>Similar fragrances</h2></div>
        <div class="grid">${similar.map(simCard).join('')}</div>
      </section>

      <section class="dsec rvsec">
        <div class="shead"><h2>Reviews</h2></div>
        <div class="rvpill"><span class="rvstars" id="rvstars" aria-hidden="true">☆☆☆☆☆</span><span class="rvcnt" id="rvcnt">No reviews yet</span>
          <button type="button" class="rvglow" data-write-review data-perfume-id="${p.id}" data-perfume-name="${p.name.replace(/"/g,'&quot;')}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Write a ParfAI review</button></div>
        <div class="rvlist" id="revs"></div>
      </section>
    `;

    document.getElementById('retailers').innerHTML = retailers.map(r=>`<a class="retail${r.cls||''}" data-r="${r.id}" href="${r.url}" target="_blank" rel="nofollow sponsored noopener">${r.name} <span class="p">${r.sub}</span></a>`).join('');

    // Structured data (Product + rating, and breadcrumbs) so search engines can
    // show star ratings and a breadcrumb trail for this fragrance.
    const pageUrl = `https://parfai.org/perfume.html?id=${encodeURIComponent(p.id)}`;
    const imageUrl = p.image ? (/^https?:\/\//.test(p.image) ? p.image : `https://parfai.org/${p.image}`) : 'https://parfai.org/images/social/og-default.jpg';
    const productSchema = {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": p.name,
      "image": imageUrl,
      "description": p.description,
      "brand": { "@type": "Brand", "name": houseName(p.houseId) },
      "aggregateRating": { "@type": "AggregateRating", "ratingValue": p.rating, "reviewCount": p.reviews, "bestRating": "5" }
    };
    const breadcrumbSchema = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Explore", "item": "https://parfai.org/explore.html" },
        { "@type": "ListItem", "position": 2, "name": houseName(p.houseId), "item": `https://parfai.org/house.html?id=${encodeURIComponent(p.houseId)}` },
        { "@type": "ListItem", "position": 3, "name": p.name, "item": pageUrl }
      ]
    };
    [productSchema, breadcrumbSchema].forEach(schema => {
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(schema);
      document.head.appendChild(s);
    });

    function renderRevs(list){
      const E = escHtml;
      const st = document.getElementById('rvstars'), ct = document.getElementById('rvcnt');
      if (list.length) {
        const avg = list.reduce((t,r)=>t+(Number(r.s)||0),0) / list.length, full = Math.floor(avg);
        st.textContent = '★'.repeat(full) + '☆'.repeat(5-full); st.className = 'rvstars on';
        ct.innerHTML = '<b>' + avg.toFixed(1) + '</b> · ' + list.length + ' review' + (list.length === 1 ? '' : 's');
      } else {
        st.textContent = '☆☆☆☆☆'; st.className = 'rvstars'; ct.textContent = 'No reviews yet';
      }
      document.getElementById('revs').innerHTML = list.slice(0, 5).map(r=>`<div class="rvc"><b>${E(r.who)}</b><span class="st">${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)}</span><p>${E(r.tx)}</p></div>`).join('');
    }

    if (typeof bindReviewButtons === 'function') bindReviewButtons();
    renderRevs([]);

    function refreshLiveRevs(){
      fetchLiveReviews(p.id).then(rows=>{
        renderRevs(rows.map(liveToCardShape));
      });
    }
    refreshLiveRevs();
    window.addEventListener('parfai:review-posted', e=>{
      if (!e.detail || e.detail.perfumeId === p.id) refreshLiveRevs();
    });
  }
})();
</script>
<script src="cookie-notice.js"></script>
</body>
</html>
