<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://parfai.org/#organization",
      "name": "ParfAI",
      "url": "https://parfai.org/",
      "logo": "https://parfai.org/images/social/logo-square.jpg",
      "description": "ParfAI is a fragrance discovery platform helping people find their next signature scent through real notes, smart matching tools, and a growing community."
    },
    {
      "@type": "WebSite",
      "@id": "https://parfai.org/#website",
      "name": "ParfAI",
      "url": "https://parfai.org/",
      "publisher": { "@id": "https://parfai.org/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://parfai.org/explore.html?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
</script>
<style>.showmore{display:block;margin:26px auto 0;border:1.5px solid var(--border);background:var(--panel);border-radius:100px;padding:12px 26px;font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer}.showmore:hover{border-color:var(--violet)}</style>
</head>
<body>

<nav id="nav-slot" data-active="explore"></nav>

<div class="wrap" id="content"><div style="padding:60px 0;color:var(--muted)">Loading…</div></div>

<div id="footer-slot"></div>

<script src="data.js?v=202610072230"></script>
<script src="catalog-lib.js?v=202610071900"></script>
<script src="note-families.js?v=202610071900"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  var PAGE = 48, shown = PAGE;
  var content = document.getElementById('content');
  var esc = PFC.esc, cap = PFC.cap;
  var raw = (qs('n') || '').trim().toLowerCase();

  // a hand-written photo and description exist for some notes (small list in data.js); match them ignoring capitals
  function findKey(obj){ if (!obj || typeof obj !== 'object') return null; var k = Object.keys(obj); for (var i = 0; i < k.length; i++) if (k[i].toLowerCase() === raw) return k[i]; return null; }
  var imgKey = findKey(typeof NOTE_IMAGE === 'object' ? NOTE_IMAGE : null);
  var img = imgKey ? NOTE_IMAGE[imgKey] : null;
  var desc = (imgKey && typeof noteDescription === 'function') ? noteDescription(imgKey) : '';

  function notFound(){
    content.innerHTML = '<div class="doc"><h1>Note not found</h1><p>We do not have that one catalogued yet.</p><a class="btn" href="notes.html">← Back to Browse by note</a></div>';
  }
  if (!raw){ notFound(); return; }

  PFC.load().then(function(d){
    var list = d.rows.filter(function(r){ return r.ok && r.notes.indexOf(raw) >= 0; }).sort(function(a, b){ return (b.sizes - a.sizes) || a.hay.localeCompare(b.hay); });
    if (!list.length){ notFound(); return; }
    var n = cap(raw), category = PFC.family(raw) || 'Fragrance note';
    updateSocialTags({
      title: n + ' — ParfAI',
      desc: 'Fragrances featuring ' + n + ': browse every ParfAI fragrance with ' + n + ' in its notes, with links to where to buy.',
      url: 'https://parfai.org/note.html?n=' + encodeURIComponent(raw),
      image: (img && img.url) ? img.url : null
    });
    var bs = document.createElement('script');
    bs.type = 'application/ld+json';
    bs.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: [
      { '@type': 'ListItem', position: 1, name: 'Browse by note', item: 'https://parfai.org/notes.html' },
      { '@type': 'ListItem', position: 2, name: n, item: 'https://parfai.org/note.html?n=' + encodeURIComponent(raw) } ] });
    document.head.appendChild(bs);
    var ci = NOTE_CATEGORY_ORDER.indexOf(category);
    var bg = (typeof gr === 'function') ? gr(ci >= 0 ? ci : 0) : 'linear-gradient(135deg,#8B7CFF,#C86BFF)';
    var col = PFC.noteCol(raw);

    content.innerHTML =
      '<div class="crumb"><a href="notes.html">Browse by note</a> / ' + esc(n) + '</div>' +
      '<div class="pdhero" style="background:' + bg + '"><div class="pdimg">' +
      (img ? '<img class="notephoto" src="' + wikiThumb(img.url, 440) + '" alt="' + esc(n) + '" loading="lazy" onerror="this.remove()">' : '<div style="width:140px;height:140px;border-radius:50%;background:' + col + ';box-shadow:inset 0 10px 18px rgba(255,255,255,.45),0 18px 30px -14px rgba(0,0,0,.5)"></div>') +
      '</div><div><div class="pdhouse">' + esc(category.toUpperCase()) + '</div><h1 class="pdname">' + esc(n) + '</h1>' +
      '<div class="pdmeta"><span><b>' + list.length.toLocaleString('en-US') + '</b> fragrance' + (list.length === 1 ? '' : 's') + ' on ParfAI</span></div>' +
      '<div class="pddesc">' + (desc ? esc(desc) : 'A ' + esc(category.toLowerCase()) + ' note used across the catalogue. A full description is on the way.') + '</div>' +
      (img ? '<div class="disclose">Photo: ' + (img.author ? esc(img.author) + ' · ' : '') + esc(img.license) + ' · <a href="' + esc(img.page) + '" target="_blank" rel="noopener" style="color:inherit">Wikimedia Commons ↗</a></div>' : '') +
      '</div></div>' +
      '<section style="margin-top:40px"><div class="shead"><h2>Fragrances with ' + esc(n) + '</h2><a href="notes.html?n=' + encodeURIComponent(raw) + '">Mix with other notes →</a></div>' +
      '<div class="grid" id="grid"></div><button class="showmore" id="more" style="display:none"></button>' +
      '<p style="text-align:center;margin-top:18px;color:var(--muted);font-size:13px">Each button opens the store\'s own page. We may earn a commission if you buy, at no cost to you. We do not show prices because they change often.</p></section>';

    function draw(){
      document.getElementById('grid').innerHTML = list.slice(0, shown).map(PFC.cardHTML).join('');
      var m = document.getElementById('more');
      m.style.display = list.length > shown ? '' : 'none';
      m.textContent = 'Show ' + Math.min(PAGE, list.length - shown) + ' more (' + (list.length - shown).toLocaleString('en-US') + ' left)';
    }
    document.getElementById('more').addEventListener('click', function(){ shown += PAGE; draw(); });
    draw();
  }).catch(function(){ content.innerHTML = '<div class="doc"><h1>Could not load</h1><p>Please refresh the page.</p></div>'; });
})();
</script>
<script src="cookie-notice.js"></script>
</body>
</html>
