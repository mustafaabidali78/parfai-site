<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://parfai.org/#organization",
      "name": "ParfAI",
      "url": "https://parfai.org/",
      "logo": "https://parfai.org/images/social/logo-square.jpg",
      "description": "ParfAI is a fragrance discovery platform helping people find their next signature scent through real notes, smart matching tools, and a growing community."
    },
    {
      "@type": "WebSite",
      "@id": "https://parfai.org/#website",
      "name": "ParfAI",
      "url": "https://parfai.org/",
      "publisher": { "@id": "https://parfai.org/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://parfai.org/explore.html?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
</script>

<body>

<nav id="nav-slot" data-active="explore"></nav>

<div class="wrap" id="content"></div>

<div id="footer-slot"></div>

<script src="data.js?v=202608301224"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script>
  const n = qs('n');
  const content = document.getElementById('content');
  const img = (typeof NOTE_IMAGE==='object' && n) ? NOTE_IMAGE[n] : null;
  const desc = (typeof noteDescription==='function' && n) ? noteDescription(n) : '';
  const exists = n && PERFUMES.some(p => perfumeAllNotes(p).includes(n));

  if (!exists){
    content.innerHTML = `<div class="doc"><h1>Note not found</h1><p>We don't have that one catalogued yet.</p><a class="btn" href="notes.html">← Back to Browse by note</a></div>`;
  } else {
    updateSocialTags({
      title: `${n} — ParfAI`,
      desc: `Fragrances featuring ${n}: browse every ParfAI fragrance with ${n} in its notes, with ratings and where to buy.`,
      url: `https://parfai.org/note.html?n=${encodeURIComponent(n)}`,
      image: (img && img.url) ? img.url : null,
    });
    const breadcrumbSchema = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Browse by note", "item": "https://parfai.org/notes.html" },
        { "@type": "ListItem", "position": 2, "name": n, "item": `https://parfai.org/note.html?n=${encodeURIComponent(n)}` }
      ]
    };
    const bs = document.createElement('script');
    bs.type = 'application/ld+json';
    bs.textContent = JSON.stringify(breadcrumbSchema);
    document.head.appendChild(bs);
    const category = noteCategory(n);
    const catIndex = NOTE_CATEGORY_ORDER.indexOf(category);
    const bgGrad = gr(catIndex >= 0 ? catIndex : 0);
    const perfumes = PERFUMES.filter(p => perfumeAllNotes(p).includes(n)).sort((a,b) => b.rating - a.rating);

    content.innerHTML = `
      <div class="crumb"><a href="notes.html">Browse by note</a> / ${n}</div>

      <div class="pdhero" style="background:${bgGrad}">
        <div class="pdimg">
          ${img ? `<img class="notephoto" src="${wikiThumb(img.url, 440)}" alt="${n}" loading="lazy" onerror="this.remove()">` : `<div class="bottle" style="width:120px;height:120px;border-radius:50%"></div>`}
        </div>
        <div>
          <div class="pdhouse">${category.toUpperCase()}</div>
          <h1 class="pdname">${n}</h1>
          <div class="pdmeta"><span><b>${perfumes.length}</b> fragrance${perfumes.length===1?'':'s'} on ParfAI</span></div>
          <div class="pddesc">${desc || `A ${category.toLowerCase()} note used across the catalog — a full description is on the way.`}</div>
          ${img ? `<div class="disclose">Photo: ${img.author ? `${img.author} · ` : ''}${img.license} · <a href="${img.page}" target="_blank" rel="noopener" style="color:inherit">Wikimedia Commons ↗</a></div>` : ''}
        </div>
      </div>

      <section style="margin-top:40px">
        <div class="shead"><h2>Fragrances with ${n}</h2><a href="notes.html?n=${encodeURIComponent(n)}">Filter by ${n} →</a></div>
        <div class="grid">${perfumes.length ? perfumes.map((p,i)=>pcardHTML(p,i)).join('') : `<div style="grid-column:1/-1;color:var(--muted);padding:20px 0">No fragrances in the catalog carry this note yet.</div>`}</div>
      </section>
    `;
  }
</script>
</body>
</html>
