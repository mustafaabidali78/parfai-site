<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — ParfAI</title>
<link rel="stylesheet" href="parfai.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<nav id="nav-slot"></nav>

<div class="authwrap">
  <div class="authcard">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your ParfAI account.</p>
    <form onsubmit="event.preventDefault(); alert('This is a design demo — sign-in isn\'t wired up yet.');">
      <div class="field"><label>Email</label><input type="email" placeholder="you@example.com" required></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••" required></div>
      <button class="btn" type="submit">Log in</button>
    </form>
    <div class="divider">or</div>
    <div class="oauth">
      <a class="btn ghost block" href="#">Continue with Apple</a>
      <a class="btn ghost block" href="#">Continue with Google</a>
    </div>
    <div class="switchline">New to ParfAI? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<div id="footer-slot"></div>

<script src="data.js"></script>
</body>
</html>
